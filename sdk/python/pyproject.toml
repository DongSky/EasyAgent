[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "easyagent-client"
version = "0.1.0"
description = "Standalone Python HTTP client and extension SDK for EasyAgent"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/easyagent_client"]
