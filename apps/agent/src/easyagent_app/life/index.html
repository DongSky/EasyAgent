<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安顿 · 生活事务管家</title><link rel="stylesheet" href="/life-assets/style.css"></head>
<body>
<header><a class="logo" href="/life">安顿<span>生活事务管家</span></a><nav><a href="/">Agent 工作室 ↗</a><button id="access" class="quiet">访问凭证</button><button id="newProject" class="primary">＋ 新的安排</button></nav></header>
<main>
<section class="hero"><div><h1>事项总览</h1></div><div class="date-mark"><span id="todayLabel"></span></div></section>
<section class="summary" aria-label="事项总览"><button data-filter="today" class="active"><span>今天要做</span><strong id="countToday">0</strong><small>含已到期事项</small></button><button data-filter="waiting"><span>正在等谁</span><strong id="countWaiting">0</strong><small>有待确认的约定</small></button><button data-filter="blocked"><span>哪里卡住</span><strong id="countBlocked">0</strong><small>前置事项或待解决问题</small></button><button data-filter="done"><span>已经办完</span><strong id="countDone">0</strong></button></section>
<section id="welcome"><div class="section-title"><h2>新建安排</h2></div><div id="scenarios" class="scenarios"></div></section>
<section class="workspace"><aside><div class="section-title"><h2>我的安排</h2><button id="allProjects" class="quiet">全部</button></div><div id="projects"></div><div class="aside-note">完成状态需确认；不会自动发送消息。</div></aside><div class="board"><div class="board-title"><div><span class="eyebrow" id="projectKind">事项</span><h2 id="boardTitle">今天要做</h2><p id="boardSubtitle"></p></div><div id="projectActions" class="actions" hidden><button id="changeDate">调整日期</button><button id="addMaterial">整理材料</button><button id="addResource">添加资料</button></div></div><div class="task-filters"><button data-filter="all">全部事项</button><button data-filter="today" class="active">今天</button><button data-filter="waiting">等待</button><button data-filter="blocked">卡住</button><button data-filter="done">办完</button></div><div id="tasks"></div><section id="resources" hidden><div class="section-title"><h3>资料与联系人</h3></div><div id="resourceList"></div><details><summary>查看变更记录</summary><div id="changes"></div></details></section></div></section>
</main>
<div id="toast" role="status"></div>
<dialog id="createDialog"><form id="createForm"><div class="dialog-title"><h2>新建安排</h2><button type="button" data-close="createDialog" class="quiet">关闭</button></div><label>是什么事<select name="kind" id="newKind"></select></label><label>名称<input name="title" id="newTitle" required placeholder="例如：十月搬到新家" maxlength="120"></label><label>主要日期<input name="anchor" type="date" required id="newDate"></label><p class="hint">按此日期生成草稿，不会联系商家或下单。</p><button class="primary" id="planButton">生成安排草稿</button></form><div id="planPreview"></div></dialog>
<dialog id="taskDialog"><form id="taskForm"><div class="dialog-title"><h2 id="taskTitle">更新事项</h2><button type="button" class="quiet" data-close="taskDialog">关闭</button></div><input type="hidden" name="id"><input type="hidden" name="expected_version"><div class="two"><label>谁负责<input name="owner" required></label><label>截止日期<input name="due" type="date"></label></div><label for="taskState">进展<select name="state" id="taskState"><option value="todo">待处理</option><option value="waiting">正在等人</option><option value="blocked">遇到问题</option><option value="done">已经办完</option></select></label><label>正在等待谁<input name="waiting_on" placeholder="例如：物业回复电梯预约"></label><label>备注 / 遇到的问题<textarea name="note"></textarea></label><label>完成凭证或确认记录<textarea name="evidence" id="taskEvidence" placeholder="例如：9 月 20 日收到预约确认，单号 ..."></textarea></label><p id="evidenceHint" class="hint"></p><div class="two"><label>相关费用（元）<input name="cost" type="number" min="0" max="1000000" step="0.01"></label><label>币种<select name="currency"><option>CNY</option><option>HKD</option><option>USD</option><option>EUR</option></select></label></div><div id="dependencies" class="hint"></div><button class="primary">保存进展</button></form></dialog>
<dialog id="dateDialog"><form id="dateForm"><div class="dialog-title"><h2>调整主要日期</h2><button type="button" class="quiet" data-close="dateDialog">关闭</button></div><label>新的日期<input name="anchor" type="date" required></label><p class="hint">尚未完成的事项会按原来的相对间隔一起调整，已经办完的记录保留原日期。</p><button class="primary">确认并更新安排</button></form></dialog>
<dialog id="resourceDialog"><form id="resourceForm"><div class="dialog-title"><h2>添加资料</h2><button type="button" class="quiet" data-close="resourceDialog">关闭</button></div><label>类型<select name="kind"><option value="document">文件 / 链接</option><option value="contact">联系人</option><option value="note">约定 / 备注</option><option value="expense">费用说明</option></select></label><label>标题<input name="title" required></label><label>内容或链接<textarea name="value" required rows="5"></textarea></label><button class="primary">保存资料</button></form></dialog>
<dialog id="materialDialog"><form id="materialForm"><div class="dialog-title"><h2>整理材料</h2><button type="button" class="quiet" data-close="materialDialog">关闭</button></div><label>原始内容<textarea name="text" required rows="7" placeholder="粘贴学校通知、预订信息或维修约定"></textarea></label><label>整理方式<select name="model" id="extractModel"><option value="template">保留原文，加入待核对事项</option></select></label><p class="hint">使用模型时，会把这段材料发给你配置的模型服务。提取出的日期和承诺需要你检查后再加入。</p><button class="primary">整理并预览</button></form><div id="materialPreview"></div></dialog>
<script type="module" src="/life-assets/app.js?v=20260920-copy-2"></script>
</body></html>
