[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "easyagent-app"
version = "0.1.0"
description = "EasyAgent browser application and same-origin API proxy"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["starlette>=0.40,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.scripts]
easyagent-app = "easyagent_app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/easyagent_app"]
