name: Integration
on: [push, pull_request]
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    # Windows setup alone takes about five minutes; leave room for the full suite.
    # The per-test 120-second watchdog still catches stalled tests and fixtures.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: uv sync --extra app --extra dev --python ${{ matrix.python }} --locked
      - name: Install Chromium for browser integration tests
        run: uv run --extra app --extra dev playwright install --with-deps chromium
      - run: uv run --extra app --extra dev ruff check src sdk/python/src apps tests examples
      - run: cargo build --locked --manifest-path sdk/rust/Cargo.toml --examples
      - id: tests
        run: uv run --extra app --extra dev pytest -v --capture=tee-sys --tb=short --durations=20 tests/integration --junitxml=.eah/ci/junit.xml
      - name: Report test failures
        if: failure() && steps.tests.outcome == 'failure'
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          timeout_report = Path('.eah/ci/test-timeout.txt')
          if timeout_report.exists():
              trace = timeout_report.read_text(encoding='utf-8')
              detail = trace.splitlines()[0] + '\n' + trace[-5000:]
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{detail}')
          report = Path('.eah/ci/junit.xml')
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case):
                      if failure.tag in ('failure', 'error'):
                          detail = (f"{case.get('classname')}.{case.get('name')}\n"
                                    + failure.get('message', '')[:500] + '\n'
                                    + (failure.text or '')[-2500:])
                          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print(f'::error::{detail}')
      - run: uv run --extra app python -m examples.demos.run_all
      - run: uv run --extra app python -m examples.demos.advanced
      - run: uv run --extra app python -m examples.demos.scenarios
