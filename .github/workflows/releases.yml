name: Build desktop and mobile artifacts
on: workflow_dispatch
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra desktop --locked --python 3.12
      - run: uv run --extra desktop python platforms/desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: .eah/build/desktop/
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: platforms/ios/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: .eah/build/ios/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: dtolnay/rust-toolchain@stable
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --locked
      - run: platforms/android/build.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
