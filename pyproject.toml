[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "easyagent"
version = "0.1.0"
description = "Durable, extensible agents with Python, JavaScript and Rust interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "LICENSING.md", "NOTICE"]
dependencies = [
  "easyagent-client==0.1.0",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "jsonschema[format-nongpl]>=4.23,<5",
  "PyYAML>=6,<7",
  "cryptography>=44,<49",
  "croniter>=6,<7",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.20,<2"]
mcp = ["mcp>=1.20,<2"]
code = ["quickjs>=1.19,<2", "wasmtime>=30,<40"]
browser = ["playwright>=1.50,<2"]
documents = ["pypdf>=5,<7"]
media = ["Pillow>=12,<13"]
app = ["easyagent-app==0.1.0", "easyagent[server,code,browser,documents,media]==0.1.0"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
desktop = [
    "pyinstaller>=6,<7",
    "easyagent[app]==0.1.0",
]

[project.scripts]
easyagent = "easyagent.cli:main"

[tool.uv.workspace]
members = ["sdk/python", "apps/agent"]

[tool.uv.sources]
easyagent-client = { workspace = true }
easyagent-app = { workspace = true }
easyagent = { workspace = true }

[tool.hatch.build]
exclude = ["/output"]

[tool.hatch.build.targets.wheel]
packages = ["src/easyagent", "examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/integration"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
